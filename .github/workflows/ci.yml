name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

concurrency:
  # PR: run lama dibatalkan. main: grup unik per commit, jadi tiap commit main menerbitkan sha-<commit>.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  test:
    name: Typecheck + unit test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      # Build Docker TIDAK pernah membuat ulang importMap.js (dan payload-types.ts), jadi
      # keduanya wajib ikut di-commit setiap kali konfigurasi Payload berubah.
      - name: Cek drift payload-types.ts dan importMap.js
        run: |
          PAYLOAD_SECRET=ci-only npm run generate:types
          PAYLOAD_SECRET=ci-only npm run generate:importmap
          git diff --exit-code -- src/payload-types.ts 'src/app/(payload)/admin/importMap.js'

  audit:
    name: Gerbang audit dependensi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: node scripts/audit-gate.mjs

  e2e:
    name: E2E (stack lengkap + backup-restore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image app
        uses: docker/build-push-action@v6
        with:
          context: web
          target: app
          load: true
          tags: toko-lokal/toko-app:uji
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Build image migrate
        uses: docker/build-push-action@v6
        with:
          context: web
          target: migrate
          load: true
          tags: toko-lokal/toko-migrate:uji
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max
      - name: Build image proxy
        uses: docker/build-push-action@v6
        with:
          context: deploy/proxy
          load: true
          tags: toko-lokal/toko-proxy:uji
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,scope=proxy,mode=max
      - name: Pasang age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Smoke test stack (aturan akses, gerbang admin, realip, staging, pemeriksaan start)
        run: SMOKE_KEEP=1 IMAGE_REPO=toko-lokal IMAGE_TAG=uji bash scripts/smoke.sh
      - name: Roundtrip backup → restore (skrip asli)
        run: bash scripts/uji-backup-restore.sh
      - name: Log bila gagal
        if: failure()
        run: |
          docker compose --env-file .uji/uji.env ps -a || true
          docker compose --env-file .uji/uji.env logs --tail 80 || true
      - name: Bersihkan
        if: always()
        run: bash scripts/smoke.sh --bersihkan

  publish:
    name: Publish image (GHCR)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [lint, test, audit, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nama image (GHCR wajib huruf kecil)
        run: echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/toko" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1) Smoke test image SEBELUM push: versi Node dan modul native di Alpine
      - name: Build app (smoke)
        uses: docker/build-push-action@v6
        with:
          context: web
          target: app
          load: true
          tags: toko-app:smoke
          cache-from: type=gha,scope=app
      - name: Smoke test app (Node ≥ 24, sharp, libsql)
        run: |
          docker run --rm --entrypoint node toko-app:smoke -e "
            if (Number(process.versions.node.split('.')[0]) < 24) throw new Error('Node ' + process.versions.node);
            require('sharp');
            console.log('OK node', process.versions.node);"
      - name: Build proxy (smoke)
        uses: docker/build-push-action@v6
        with:
          context: deploy/proxy
          load: true
          tags: toko-proxy:smoke
          cache-from: type=gha,scope=proxy
      - name: Uji config proxy SETELAH template di-render
        run: |
          docker run --rm -e WEB_SUBNET=172.18.0.0/16 -e ADMIN_HOST=admin.contoh.test toko-proxy:smoke nginx -t
          docker run --rm --entrypoint nginx toko-proxy:smoke -V 2>&1 | grep -q http_auth_request_module

      # 2) Push ketiga image dengan tag sha SAJA (deploy memakai sha, panduan W8)
      - name: Push app
        uses: docker/build-push-action@v6
        with:
          context: web
          target: app
          push: true
          tags: ${{ env.IMG }}-app:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=app
      - name: Push migrate
        uses: docker/build-push-action@v6
        with:
          context: web
          target: migrate
          push: true
          tags: ${{ env.IMG }}-migrate:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=migrate
      - name: Push proxy
        uses: docker/build-push-action@v6
        with:
          context: deploy/proxy
          push: true
          tags: ${{ env.IMG }}-proxy:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=proxy

      # 3) latest hanya setelah ketiganya sukses (penanda saja; deploy memakai sha)
      - name: Tag latest
        run: |
          for n in app migrate proxy; do
            docker buildx imagetools create -t "$IMG-$n:latest" "$IMG-$n:sha-${{ github.sha }}"
          done
      - name: Ringkasan
        run: |
          {
            echo "### Image terbit untuk \`${GITHUB_SHA}\`"
            for n in app migrate proxy; do echo "- \`$IMG-$n:sha-${GITHUB_SHA}\`"; done
            echo
            echo "Deploy: \`IMAGE_TAG=sha-${GITHUB_SHA}\` (staging dulu, lalu produksi dengan SHA yang sama)."
          } >> "$GITHUB_STEP_SUMMARY"
