# Header ke app. $remote_addr sudah IP klien asli (realip dari network web).
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;      # app: percaya 1 hop (toko-proxy)
proxy_set_header X-Forwarded-Proto $toko_fwd_proto;   # https dari edge
proxy_set_header X-Forwarded-Host  $host;             # cek Origin server action Next.js
proxy_set_header CF-Connecting-IP  "";                # bisa dipalsukan dari network web; app memakai X-Real-IP
proxy_set_header Connection        "";
proxy_read_timeout 120s;
