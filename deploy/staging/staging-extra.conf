# HANYA staging: di-mount ke /etc/nginx/toko-extra/staging.conf oleh docker-compose.staging.yml
# dan di-include di tingkat server host publik toko-staging-proxy.
# /healthz, /nginx-health, dan halaman pemeliharaan memakai `auth_basic off`.
auth_basic "Staging";
auth_basic_user_file /etc/nginx/toko-auth/htpasswd;
add_header X-Robots-Tag "noindex, nofollow" always;
